<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kapi fx</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="effects.js"></script>
<script>
// Fullscreen effect layer: a transparent, always-on-top, click-through window that covers the pet's monitor.
// Opened by the pet window via `open_fx_window`, receives one "fx-play" event, plays it with KapiFx, then closes itself.
(async () => {
  const TAURI = window.__TAURI__;
  const win = TAURI.window.getCurrentWindow();
  const canvas = document.getElementById('c');
  const dpr = window.devicePixelRatio || 1;
  function fit() { canvas.width = Math.round(window.innerWidth * dpr); canvas.height = Math.round(window.innerHeight * dpr); }
  fit(); window.addEventListener('resize', fit);
  try { await win.setIgnoreCursorEvents(true); } catch (_) {}
  const ctx = canvas.getContext('2d');
  let done = false;
  const close = async () => { if (done) return; done = true; try { await win.close(); } catch (_) {} };
  const params = new URLSearchParams(location.search);
  const run = async (p) => {
    let cup = null;
    if (p.cupUrl) { try { cup = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = p.cupUrl; }); } catch (_) {} }
    await KapiFx.play(ctx, canvas.width, canvas.height, dpr, p.effect, { from: p.from, dir: p.dir, cup, color: p.color });
    await close();
  };
  await TAURI.event.listen('fx-play', (e) => run(e.payload || {}));
  await TAURI.event.emit('fx-ready', { label: win.label });
  setTimeout(close, 15000);                       // safety: never linger
})();
</script>
</body>
</html>
