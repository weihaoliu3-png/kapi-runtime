[package]
name = "kapi"
version = "0.8.15"
description = "Kapi desktop pet runtime"
edition = "2021"

[lib]
name = "kapi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
active-win-pos-rs = "0.9"
battery = "0.7"
device_query = "3"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true
